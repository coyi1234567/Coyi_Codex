name: CI

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:
    branches: ["main", "codex/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run configuration checks
        run: npm run test

      - name: Build production bundle
        run: npm run build
